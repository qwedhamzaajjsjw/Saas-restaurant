# =============================================================================
# Supervisor configuration — Restaurant SaaS Queue Worker
# المسار: /etc/supervisor/conf.d/restaurant-worker.conf
# تطبيق: supervisorctl reread && supervisorctl update && supervisorctl start restaurant-worker:*
# =============================================================================

[program:restaurant-worker]
process_name=%(program_name)s_%(process_num)02d
command=php8.3 /var/www/restaurant/artisan queue:work database \
        --sleep=3 \
        --tries=3 \
        --max-time=3600 \
        --timeout=90

; عدد العمليات المتوازية (زد هذا الرقم مع زيادة الحمل)
numprocs=2

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/restaurant-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
