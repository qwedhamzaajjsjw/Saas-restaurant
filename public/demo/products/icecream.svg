  <circle cx="200" cy="65" r="10" fill="#dc2626"/>
  <path d="M200 57 Q208 46 215 42" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Sprinkles -->
  <rect x="175" y="120" width="10" height="4" rx="2" fill="#f97316" transform="rotate(40,175,120)"/>
  <rect x="215" y="115" width="10" height="4" rx="2" fill="#0284c7" transform="rotate(-25,215,115)"/>
  <rect x="190" y="155" width="10" height="4" rx="2" fill="#fbbf24" transform="rotate(60,190,155)"/>
  <rect x="220" y="148" width="10" height="4" rx="2" fill="#16a34a" transform="rotate(-40,220,148)"/>
</svg>
