  <line x1="180" y1="192" x2="200" y2="270" stroke="#b45309" stroke-width="1.5" opacity="0.5"/>
  <line x1="220" y1="192" x2="200" y2="270" stroke="#b45309" stroke-width="1.5" opacity="0.5"/>
  <path d="M161 205 Q200 210 239 205" stroke="#b45309" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M165 220 Q200 226 235 220" stroke="#b45309" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M170 238 Q200 244 230 238" stroke="#b45309" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Scoop 3 (bottom) -->
  <circle cx="200" cy="185" r="52" fill="#fce7f3"/>
  <!-- Scoop 2 -->
  <circle cx="200" cy="145" r="48" fill="#fda4af"/>
  <!-- Scoop 1 (top) -->
  <circle cx="200" cy="108" r="44" fill="#f9a8d4"/>
  <!-- Chocolate drizzle -->
  <path d="M185 105 Q195 125 182 140 Q195 135 205 150" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round"/>
