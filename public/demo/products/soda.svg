<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="120" fill="rgba(255,255,255,0.07)"/>
  <!-- Cup body -->
  <path d="M155 90 L170 250 L230 250 L245 90Z" fill="url(#cup)"/>
  <!-- Cup highlights -->
  <path d="M175 90 L182 250 L170 250 L163 90Z" fill="rgba(255,255,255,0.15)"/>
  <!-- Lid -->
  <rect x="148" y="82" width="104" height="14" rx="7" fill="#b91c1c"/>
  <rect x="155" y="78" width="90" height="10" rx="5" fill="#dc2626"/>
  <!-- Straw -->
  <rect x="208" y="30" width="10" height="70" rx="4" fill="white" opacity="0.9"/>
  <rect x="208" y="30" width="10" height="10" rx="3" fill="#fbbf24" opacity="0.9"/>
  <rect x="208" y="50" width="10" height="10" rx="3" fill="#fbbf24" opacity="0.9"/>
  <!-- Bubbles -->
  <circle cx="175" cy="150" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="200" cy="130" r="4" fill="rgba(255,255,255,0.25)"/>
  <circle cx="220" cy="160" r="6" fill="rgba(255,255,255,0.2)"/>
  <circle cx="185" cy="185" r="3" fill="rgba(255,255,255,0.3)"/>
  <!-- Cup design stripes -->
  <path d="M160 120 L240 120 L238 130 L162 130Z" fill="rgba(255,255,255,0.1)"/>
</svg>
