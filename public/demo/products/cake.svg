<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="120" fill="rgba(255,255,255,0.07)"/>
  <!-- Cake plate -->
  <ellipse cx="200" cy="240" rx="100" ry="12" fill="rgba(0,0,0,0.2)"/>
  <!-- Cake bottom layer -->
  <rect x="115" y="190" width="170" height="50" rx="8" fill="#c2410c"/>
  <!-- Chocolate layer -->
  <rect x="115" y="185" width="170" height="10" rx="3" fill="#7c2d12"/>
  <!-- Middle frosting -->
  <rect x="112" y="175" width="176" height="15" rx="5" fill="#fce7f3"/>
  <!-- Top cake layer -->
  <rect x="118" y="130" width="164" height="50" rx="8" fill="#be185d"/>
  <!-- Top frosting -->
  <rect x="112" y="122" width="176" height="14" rx="5" fill="#fce7f3"/>
  <!-- Candle -->
  <rect x="195" y="80" width="10" height="45" rx="3" fill="#fbbf24"/>
  <rect x="196" y="77" width="8" height="10" rx="2" fill="#f97316" opacity="0.8"/>
  <!-- Flame -->
  <ellipse cx="200" cy="70" rx="6" ry="10" fill="#fde68a"/>
  <ellipse cx="200" cy="72" rx="3" ry="6" fill="#f97316"/>
  <!-- Chocolate drips -->
  <path d="M130 122 Q133 140 128 145" stroke="#7c2d12" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M165 122 Q168 138 163 142" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M240 122 Q243 136 238 140" stroke="#7c2d12" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M268 122 Q271 138 266 143" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Sprinkles -->
  <rect x="145" y="155" width="12" height="4" rx="2" fill="#f97316" transform="rotate(30,145,155)"/>
  <rect x="200" y="148" width="12" height="4" rx="2" fill="#0284c7" transform="rotate(-20,200,148)"/>
  <rect x="230" y="160" width="10" height="4" rx="2" fill="#16a34a" transform="rotate(45,230,160)"/>
  <rect x="170" y="162" width="10" height="4" rx="2" fill="#f59e0b" transform="rotate(-35,170,162)"/>
</svg>
