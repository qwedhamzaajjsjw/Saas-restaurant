<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="120" fill="rgba(255,255,255,0.07)"/>
  <!-- Glass body -->
  <path d="M155 80 L165 260 L235 260 L245 80Z" fill="rgba(255,255,255,0.12)"/>
  <!-- Juice fill (orange juice) -->
  <path d="M158 110 L165 260 L235 260 L242 110Z" fill="#f97316" opacity="0.75"/>
  <!-- Glass front highlight -->
  <path d="M165 80 L170 260 L160 260 L155 80Z" fill="rgba(255,255,255,0.18)"/>
  <!-- Ice cubes -->
  <rect x="168" y="130" width="22" height="22" rx="4" fill="rgba(255,255,255,0.4)" transform="rotate(15,179,141)"/>
  <rect x="205" y="145" width="20" height="20" rx="4" fill="rgba(255,255,255,0.35)" transform="rotate(-10,215,155)"/>
  <rect x="185" y="160" width="18" height="18" rx="4" fill="rgba(255,255,255,0.3)" transform="rotate(5,194,169)"/>
  <!-- Rim of glass -->
  <rect x="152" y="74" width="96" height="12" rx="6" fill="rgba(255,255,255,0.2)"/>
  <!-- Straw -->
  <rect x="220" y="30" width="8" height="80" rx="3" fill="#22c55e" opacity="0.9"/>
  <!-- Orange slice on rim -->
  <ellipse cx="165" cy="76" rx="20" ry="20" fill="#f97316"/>
  <ellipse cx="165" cy="76" rx="14" ry="14" fill="#fb923c"/>
  <!-- Orange slice segments -->
  <line x1="165" y1="58" x2="165" y2="94" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="148" y1="67" x2="182" y2="85" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="148" y1="85" x2="182" y2="67" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="165" cy="76" r="4" fill="#ea580c"/>
  <!-- Green leaf -->
  <path d="M165 58 Q172 48 178 52 Q170 56 165 58Z" fill="#16a34a"/>
  <!-- Bubbles in juice -->
  <circle cx="175" cy="200" r="4" fill="rgba(255,255,255,0.25)"/>
  <circle cx="200" cy="185" r="3" fill="rgba(255,255,255,0.2)"/>
  <circle cx="220" cy="210" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="185" cy="225" r="3" fill="rgba(255,255,255,0.25)"/>
</svg>
